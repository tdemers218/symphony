[package]
name = "symphony-app"
description = "Symphony desktop app: dockable views over the Symphony scene model."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "symphony"
path = "src/main.rs"

[dependencies]
# Heavy pure work (erasing many strokes) across the cores (ENGINEERING E6.1).
rayon = "1"
bzip2 = "0.6"
dirs = "7"
symphony-brushes = { path = "../symphony-brushes" }
eframe = { version = "0.37", features = ["persistence"] }
egui_dock = { version = "0.22", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "tga", "dds", "exr", "ff", "hdr", "ico", "pnm", "qoi"] }
# Photoshop files: each layer comes in as a layer.
psd = "0.3"
# OpenRaster (.ora) and Krita (.kra) files are zip archives.
zip = { version = "9", default-features = false, features = ["deflate"] }
openh264 = { version = "0.9", default-features = false, features = ["libloading"] }
mp4 = "0.14"
# SVG import: drawn to a picture (MPL-2.0).
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts"] }
# Sound import: pure-Rust decoding (MPL-2.0) and playback (Apache-2.0).
symphonia = { version = "0.5", features = ["aac", "isomp4", "mp3", "wav", "pcm", "flac", "vorbis", "ogg", "aiff", "alac"] }
cpal = "0.15"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
symphony-core = { path = "../symphony-core" }
symphony-launcher = { path = "../symphony-launcher" }
symphony-io = { path = "../symphony-io" }
symphony-pen = { path = "../symphony-pen" }
symphony-render = { path = "../symphony-render" }
symphony-ui = { path = "../symphony-ui" }
symphony-vector = { path = "../symphony-vector" }
ureq = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSColor", "NSColorSpace", "NSColorSampler", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tempfile = "3"
egui_kittest = "0.37"
