[workspace]
resolver = "2"
members = [
    "crates/symphony-app",
    "crates/symphony-core",
    "crates/symphony-vector",
    "crates/symphony-io",
    "crates/symphony-render",
    "crates/symphony-pen",
    "crates/symphony-pentest",
    "crates/symphony-ui",
    "crates/symphony-launcher",
    "crates/symphony-brushes",
    "crates/symphony-manual",
]

[workspace.package]
version = "0.1.0-preview.1"
edition = "2021"
license = "GPL-3.0-or-later"

# egui_dock with Symphony's changes (rounded, fading drop targets). MIT
# licensed; see vendor/egui_dock/LICENSE and vendor/README.md.
[patch.crates-io]
egui_dock = { path = "vendor/egui_dock" }
# egui-wgpu with Symphony's backdrop blur (see vendor/README.md). MIT OR
# Apache-2.0.
egui-wgpu = { path = "vendor/egui-wgpu" }
